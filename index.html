<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Portfolio Slider</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#f7f4ef;
  overflow:hidden;
  font-family:'Poppins',sans-serif;
}

.jf-showcase{
  width:100%;
  overflow:hidden;
  padding:60px 0;
}

.jf-heading{
  text-align:center;
  margin-bottom:40px;
}

.jf-heading h2{
  font-size:clamp(36px,5vw,72px);
  line-height:1;
  font-weight:700;
  color:#111;
  letter-spacing:-0.04em;
}

.jf-slider-wrap{
  width:100%;
  overflow:hidden;
}

.jf-slider{
  display:flex;
  gap:28px;
  width:max-content;
  animation:jf-scroll 40s linear infinite;
}

.jf-slider img{
  width:320px;
  height:420px;
  object-fit:cover;
  border-radius:18px;
  transition:transform .35s ease;
  box-shadow:0 15px 35px rgba(0,0,0,.12);
}

.jf-slider img:hover{
  transform:scale(1.04);
}

@keyframes jf-scroll{
  from{
    transform:translateX(0);
  }

  to{
    transform:translateX(-50%);
  }
}

@media(max-width:768px){

  .jf-showcase{
    padding:40px 0;
  }

  .jf-slider{
    gap:18px;
  }

  .jf-slider img{
    width:220px;
    height:300px;
    border-radius:14px;
  }

}

</style>
</head>

<body>

<section class="jf-showcase">

  <div class="jf-heading">
    <h2>Sneak peek of my work</h2>
  </div>

  <div class="jf-slider-wrap">

    <div class="jf-slider">

      <!-- FIRST SET -->

      <img src="https://picsum.photos/600/800?random=1">
      <img src="https://picsum.photos/600/800?random=2">
      <img src="https://picsum.photos/600/800?random=3">
      <img src="https://picsum.photos/600/800?random=4">
      <img src="https://picsum.photos/600/800?random=5">
      <img src="https://picsum.photos/600/800?random=6">

      <!-- DUPLICATE SET FOR INFINITE LOOP -->

      <img src="https://picsum.photos/600/800?random=1">
      <img src="https://picsum.photos/600/800?random=2">
      <img src="https://picsum.photos/600/800?random=3">
      <img src="https://picsum.photos/600/800?random=4">
      <img src="https://picsum.photos/600/800?random=5">
      <img src="https://picsum.photos/600/800?random=6">

    </div>

  </div>

</section>

</body>
</html>
